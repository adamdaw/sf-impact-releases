[package]
name = "sf-impact-extract"
description.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
foldhash.workspace = true
libmimalloc-sys.workspace = true
mimalloc.workspace = true
quick-xml = "0.42"
rayon.workspace = true
serde_json.workspace = true
sf-impact-common = { path = "../sf-impact-common" }
# For its git module alone: the one place where these tools run git.
sf-impact-delta = { path = "../sf-impact-delta" }
# The two hashes that git names a blob by.
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
tree-sitter.workspace = true
tree-sitter-sfapex.workspace = true

[dev-dependencies]
jsonschema = { version = "=0.61.2", default-features = false }
# The reuse tests hold a pack cut short to the stages that read it.
sf-impact-changed = { path = "../sf-impact-changed" }
sf-impact-tests = { path = "../sf-impact-tests" }
