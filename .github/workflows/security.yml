name: dependency security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
permissions: {}
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit lockfile
        # audit-check cannot create check runs for fork PRs; cargo-deny covers PRs.
        if: github.event_name != 'pull_request'
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # remove when quick-xml >= 0.41 lands
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          arguments: --locked
